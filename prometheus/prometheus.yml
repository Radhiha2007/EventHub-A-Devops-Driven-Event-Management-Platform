global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "eventhub-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: "eventhub-frontend"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://frontend:5173"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115

  - job_name: "eventhub-postgres"
    static_configs:
      - targets: ["postgres_exporter:9187"]
  - job_name: "eventhub-redis"
    static_configs:
      - targets: ["redis_exporter:9121"]
  - job_name: "eventhub-celery"
    metrics_path: /metrics
    static_configs:
      - targets: ["flower:5555"]

name: EventHub CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    env:
      ENTRA_TENANT_ID: 5beb351c-3fb8-418f-b612-fe36ace96ef3
      ENTRA_API_CLIENT_ID: 0be8884f-4a48-47e1-ba49-80770c4debc7
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eventhub
          POSTGRES_USER: eventhub_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U eventhub_user -d eventhub"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check backend import
        working-directory: backend
        env:
          POSTGRES_DB: eventhub
          POSTGRES_USER: eventhub_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          python -c "from app.main import app; print('Backend import successful')"

      - name: Initialize database
        working-directory: backend
        env:
          POSTGRES_DB: eventhub
          POSTGRES_USER: eventhub_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          python -m app.database.init_db

      - name: Run backend tests
        working-directory: backend
        env:
          POSTGRES_DB: eventhub
          POSTGRES_USER: eventhub_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          python -m pytest
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
